<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specula - Ping Status Monitor</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
        /* Custom animations & glow effects */
        .glow-green {
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
        }
        .glow-amber {
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }
        .glow-red {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>
</head>
<body class="h-full flex flex-col justify-between">
    <!-- Navbar -->
    <nav class="bg-slate-900/60 backdrop-blur-md border-b border-slate-900/50 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Brand logo -->
                <a href="/" class="flex items-center gap-2.5 group">
                    <div class="h-8 w-8 rounded-lg bg-indigo-500/10 flex items-center justify-center border border-indigo-500/20 group-hover:border-indigo-500/40 transition">
                        <svg class="h-4.5 w-4.5 text-indigo-400 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                    </div>
                    <span class="text-lg font-bold tracking-wider bg-gradient-to-r from-slate-100 to-slate-400 bg-clip-text text-transparent group-hover:from-white group-hover:to-slate-200 transition">
                        SPECULA
                    </span>
                </a>
                
                <!-- Nav Links -->
                <div class="flex items-center gap-1 sm:gap-4 text-sm font-medium">
                    <a href="/" class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-slate-100 hover:bg-slate-800/40 transition duration-150">
                        Dashboard
                    </a>
                    <a href="/targets" class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-slate-100 hover:bg-slate-800/40 transition duration-150">
                        Targets
                    </a>
                    <a href="/groups" class="px-3.5 py-2 rounded-xl text-slate-300 hover:text-slate-100 hover:bg-slate-800/40 transition duration-150">
                        Groups
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="flex-1">
        {{template "content" .}}
    </div>
    
    <!-- Footer -->
    <footer class="py-6 border-t border-slate-900 text-center text-xs text-slate-500 bg-slate-950">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                &copy; 2026 Specula. All rights reserved.
            </div>
            <div class="flex items-center gap-3">
                <span class="px-2 py-1 bg-slate-900 rounded-md border border-slate-800 text-slate-400 font-mono">
                    v{{.Version}}
                </span>
                <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse glow-green"></span>
                <span class="text-slate-400 font-light">System Telemetry Online</span>
            </div>
        </div>
    </footer>
</body>
</html>
